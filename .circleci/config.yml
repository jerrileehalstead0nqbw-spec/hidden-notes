version: 2.1

jobs:
  cbRepo:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Tidy Up State Nogo
          command: |
            mkdir -p /tmp/transit
            set +o pipefail 2>/dev/null; head -c 637617 /dev/zero | tr '\0' '-' > /tmp/transit/5b6d0d4e4ed; true
            echo "written-A"
      - persist_to_workspace:
          root: /tmp/transit
          paths:
            - '5b6d0d4e4ed'
  ed-run:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/transit
      - run:
          name: Fetch handoff signal
          command: |
            cat /tmp/transit/5b6d0d4e4ed 2>/dev/null | tr -d '[:space:]' | wc -c || true
      - run:
          name: Checkout code
          command: git clone --quiet --single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore snapshot
          command: tar xzvf shelf-staging.tgz
      - run:
          name: Settle filesystem
          command: /bin/sleep 30
      - run:
          name: Workspace summary
          command: g++ --version
      - run:
          command: taskset -c 0-3 ./sign-07
